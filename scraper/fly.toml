app = "schoolz-scraper"
primary_region = "ewr"

# No [http_service]/public IP on purpose - this is only reachable from other
# apps in the same Fly org over the private 6PN network
# (http://schoolz-scraper.internal:8765), same pattern as billz's own
# scraper. Keeps the Playwright/Chromium service off the public internet
# entirely; SCRAPER_API_KEY is still required as defense in depth.

[build]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[[services]]
  internal_port = 8765
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 8765
