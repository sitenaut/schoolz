name: Backup

# Nightly encrypted Postgres dump into the schoolz-backup bucket.
# Restore steps: docs/BACKUPS.md.

on:
  schedule:
    - cron: "17 7 * * *"  # 07:17 UTC
  workflow_dispatch:

concurrency:
  group: backup-prod
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump, encrypt, upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: |
          for name in BACKUP_DATABASE_URL BACKUP_S3_ENDPOINT BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name is not set for the prod environment" >&2
              exit 1
            fi
          done
          bash scripts/backup.sh --docker

      # The schoolz-backup-stale alert fires when this stops arriving.
      - name: Report success to Grafana
        env:
          OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          for name in OTLP_ENDPOINT OTLP_HEADERS; do
            if [ -z "${!name}" ]; then
              echo "$name is not set for the prod environment" >&2
              exit 1
            fi
          done
          # The secret is spelled for the OTel SDK ("Authorization=Basic%20…"); curl wants "Name: value".
          header="${OTLP_HEADERS/=/: }"
          header="${header//%20/ }"
          now="$(date +%s)"
          curl --fail-with-body -sS -X POST "${OTLP_ENDPOINT%/}/v1/metrics" \
            -H "$header" -H "Content-Type: application/json" --data-binary @- <<EOF
          {"resourceMetrics": [{
            "resource": {"attributes": [
              {"key": "service.namespace", "value": {"stringValue": "schoolz"}},
              {"key": "service.name", "value": {"stringValue": "schoolz-backup"}}]},
            "scopeMetrics": [{"scope": {"name": "backup"}, "metrics": [{
              "name": "schoolz.backup.last_success_timestamp", "unit": "s",
              "gauge": {"dataPoints": [{"asInt": "$now", "timeUnixNano": "${now}000000000"}]}}]}]}]}
          EOF
