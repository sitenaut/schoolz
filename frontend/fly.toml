app = "schoolz-web"
primary_region = "ewr"

[build]
  # Supabase's URL and "publishable" (anon) key are safe to ship in a public
  # client bundle - they're designed to be public and are constrained by
  # Row Level Security, not secrecy. Never put the service_role key here.
  [build.args]
    VITE_AUTH_MODE = "supabase"
    VITE_API_URL = "https://schoolz-api.sitenaut.com"
    VITE_SUPABASE_URL = "https://lxithuvstfslndvsdnsk.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ymxiIhkeaV6R5egNQI9gwA_iY95YXIR"
    VITE_APP_VERSION = "prod"
    VITE_FARO_URL = "/rum/collect"
    VITE_PUBLIC_WEB_URL = "https://schoolz.sitenaut.com"

[env]
  # nginx.conf.template proxies crawler user agents here instead of
  # serving the SPA shell, for SEO (see backend/services/prerender.py).
  # Deliberately schoolz-api's PUBLIC hostname, not its .internal 6PN
  # address: schoolz-api only exposes a public http_service, and its
  # fly-proxy health check requires binding 0.0.0.0, which can't also
  # accept 6PN's IPv6-only private-network traffic (confirmed live -
  # switching schoolz-api to an IPv6 bind to serve 6PN broke fly-proxy
  # outright, a real prod outage on 2026-09-12). Routing through the
  # public hostname means schoolz-api never needs private-network
  # reachability for this feature.
  BACKEND_INTERNAL_URL = "https://schoolz-api.sitenaut.com"
  # Fly's own system resolver (6PN) - also resolves ordinary public
  # hostnames like schoolz-api.sitenaut.com above, not just .internal
  # ones (every outbound call this app makes already relies on this).
  # Docker's embedded 127.0.0.11 (the image's default) doesn't exist on a
  # Fly machine.
  RESOLVER = "[fdaa::3]:53"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
