services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-schoolz}
      POSTGRES_USER: ${DATABASE_USER:-schoolz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-schoolz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-local}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-schoolz}
      DATABASE_USER: ${DATABASE_USER:-schoolz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-local}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-schoolz}
      DATABASE_USER: ${DATABASE_USER:-schoolz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      # The scraper container's own render target for /prerender - see
      # backend/services/prerender.py for why this can't just be
      # PUBLIC_WEB_URL (localhost:5173 only means something on the host).
      FRONTEND_INTERNAL_URL: http://frontend:3000
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8765}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      LOCAL_EVENTS_SCRAPER_URL: ${LOCAL_EVENTS_SCRAPER_URL:-}
      LOCAL_EVENTS_SCRAPER_KEY: ${LOCAL_EVENTS_SCRAPER_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The chatbot's own keys (services/chat_providers.py) - listed here
      # because only variables named in this block reach the container.
      CHATBOT_ANTHROPIC_API_KEY: ${CHATBOT_ANTHROPIC_API_KEY:-}
      CHATBOT_GEMINI_API_KEY: ${CHATBOT_GEMINI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  scheduler:
    build: ./backend
    # Opt-in (SCHEDULER=1 scripts/compose-local.sh up): left running, it
    # re-scans every Google Doc/Calendar/Site source from the home IP on the
    # same 12h cron prod already runs, which got that network CAPTCHA'd by
    # Google. Run-now from the admin UI still works without it.
    profiles: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-schoolz}
      DATABASE_USER: ${DATABASE_USER:-schoolz}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8765}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      LOCAL_EVENTS_SCRAPER_URL: ${LOCAL_EVENTS_SCRAPER_URL:-}
      LOCAL_EVENTS_SCRAPER_KEY: ${LOCAL_EVENTS_SCRAPER_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
    command: ["python", "-m", "scheduler.entrypoint"]
    restart: unless-stopped

  scraper:
    build: ./scraper
    # The image binds "::" for Fly's IPv6-only private network, and asyncio
    # makes that socket IPv6-only - so on compose's IPv4 network the backend
    # got "connection refused". Locally, bind IPv4 instead.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
    ports:
      - "8765:8765"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_MODE: ${AUTH_MODE:-local}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_VERSION: local
        VITE_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    environment:
      # Lets nginx proxy crawler user-agents straight to the backend's
      # /prerender endpoint instead of the SPA shell - see
      # nginx.conf.template. "backend" is this compose file's own service
      # name; prod sets this to http://schoolz-api.internal:8000 instead.
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:3000"

  # ── Grafana Alloy (metrics shipper: scrapes backend /metrics, pushes to Mimir) ──
  alloy:
    image: grafana/alloy:latest
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - backend
      - mimir
    profiles: ["obs-local"]
    restart: unless-stopped

  # ── Grafana Mimir (metrics storage) ─────────────────────────────────────────
  mimir:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data
    profiles: ["obs-local"]
    restart: unless-stopped

  # ── Loki (log aggregation) ──────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    profiles: ["obs-local"]
    restart: unless-stopped

  # ── Promtail (ships container logs to Loki) ─────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9080:9080"
    depends_on:
      - loki
    profiles: ["obs-local"]
    restart: unless-stopped

  # ── Grafana (dashboards over Mimir + Loki) ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - mimir
      - loki
    ports:
      - "3001:3000"
    profiles: ["obs-local"]
    restart: unless-stopped

volumes:
  postgres_data:
  mimir_data:
  loki_data:
  grafana_data:
