name: Backfill translations

# Runs backend/scripts/backfill_translations.py on the always-on `scheduler`
# machine (it has the prod DB and Anthropic secrets; nothing is copied into
# GitHub). The script ships in the backend image, so deploy the backend first
# if the script itself changed. Safe to re-run: only missing/stale rows are
# generated.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language(s) to backfill"
        required: true
        default: "both"
        type: choice
        options: ["both", "es", "zh"]

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run on the scheduler machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LANG_INPUT: ${{ github.event.inputs.lang }}
        run: |
          langs="$LANG_INPUT"; [ "$langs" = "both" ] && langs="es zh"
          machine=$(flyctl machines list -a schoolz-api --json \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "scheduler" and .state == "started")][0].id')
          if [ -z "$machine" ] || [ "$machine" = "null" ]; then
            echo "no started scheduler machine found" >&2
            exit 1
          fi
          echo "scheduler machine: $machine"
          # machine exec caps at 600s, so start the job detached and poll its log.
          run() { flyctl machine exec -a schoolz-api --timeout 120 "$machine" "$1"; }
          run "sh -c 'rm -f /tmp/backfill.done; nohup sh -c \"cd /app && python scripts/backfill_translations.py $langs > /tmp/backfill.log 2>&1; echo \\\$? > /tmp/backfill.done\" > /dev/null 2>&1 &'"
          seen=0
          while true; do
            sleep 45
            out=$(run "sh -c 'cat /tmp/backfill.log; echo ---; cat /tmp/backfill.done 2>/dev/null'") || { echo "poll failed, retrying"; continue; }
            log=${out%%---*}
            echo "$log" | tail -n +$((seen + 1))
            seen=$(echo "$log" | wc -l)
            rc=$(echo "${out##*---}" | tr -d '[:space:]')
            if [ -n "$rc" ]; then
              echo "script exit code: $rc"
              [ "$rc" = "0" ] && exit 0 || exit 1
            fi
          done
