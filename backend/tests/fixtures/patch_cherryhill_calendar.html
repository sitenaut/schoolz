<html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"mainContent": {"totalCount": 16, "allEvents": {"1790942400": [{"id": "fb7092be-7d6d-4532-b134-fef78e001a5a", "title": "Estate Planning: 5 Essential Things You Should Know", "shortTitle": "Estate Planning: 5 Essential Things You Should...", "status": 1, "type": "event", "eventType": "paid", "body": "<p><strong>Register to view our estate planning presentation:</strong></p>\n<p><strong>Available online on&nbsp;<u><a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" target=\"_blank\" rel=\"nofollow noopener\">Friday, Oct 2, at 2:30 PM</a></u> and&nbsp;<u><u><a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" rel=\"nofollow noopener\" target=\"_blank\"></a><a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" target=\"_blank\" rel=\"nofollow noopener\">Saturday, Oct 3, at 11:00 AM</a></u></u></strong></p>\n<p>==&gt; <a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" rel=\"nofollow noopener\" target=\"_blank\"><b><u>Click Here to Register</u></b></a> or <strong><a href=\"tel:2013802000\" rel=\"nofollow\" target=\"_blank\"></a><strong><a href=\"tel:2013802000\" rel=\"noopener\" target=\"_blank\">Call 201-380-2000</a></strong></strong></p>\n<p>This is a <em><strong><u>free educational presentation</u></strong></em> offered by Milvidskiy Law Group P.C., an elder law and estate planning firm serving communities across New Jersey and New York.</p>\n<p><strong>In this presentation,&nbsp;you'll learn:</strong></p>\n<ul><li>How to <strong><em><u>avoid probate and guardianship</u></em></strong>, keep your estate matters private and appoint a family member or a friend to make financial and health-care decisions if you become incapacitated due to an illness, injury or advanced age.</li><li>The differences between having&nbsp;a<em> <u><strong>Will&nbsp;vs.&nbsp;Living Trust</strong></u></em> and how to determine which one you need.</li><li>How to plan for <em><strong><u>Long-Term Care</u></strong></em> and qualify for <em><strong><u>Medicaid</u></strong></em>&nbsp;benefits and protect your home and life savings.</li><li><strong><u>How to protect your home and other assets</u></strong>&nbsp;during your life, but also for the lives of your children/beneficiaries (large debts or unpaid judgments, irresponsible or risky lifestyles, unstable marriages, etc.)</li></ul>\n<p>==&gt; <a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" rel=\"nofollow noopener\" target=\"_blank\"><b><u>Click Here to Register</u></b></a> or <strong><a href=\"tel:2013802000\" rel=\"nofollow\" target=\"_blank\"></a><strong><a href=\"tel:2013802000\" rel=\"noopener\" target=\"_blank\">Call 201-380-2000</a></strong></strong><strong><strong><a href=\"tel:2013802000\" rel=\"nofollow\" target=\"_blank\"></a></strong></strong></p>\n<p><a href=\"tel:8773103939\" rel=\"nofollow\" target=\"_blank\"></a></p>\n<p>The presentation is delivered by <em>Andrey Milvidskiy, Esq.</em>, the principal attorney of Milvidskiy Law Group P.C.&nbsp;and the author of the book <em><a href=\"https://www.amazon.com/Law-Aging-Estate-Planning-Beyond/dp/B08NZVZLLG\" target=\"_blank\" rel=\"nofollow noopener\"><b>The Law of Aging</b></a></em> (available at Barnes &amp; Noble and Amazon).</p>\n<p>Presentation registration link: <a href=\"https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&amp;utm_campaign=turning_65_webinar\" rel=\"nofollow noopener\" target=\"_blank\"><b><u>https://milvidlaw.com/presentation/</u></b></a></p>\n<p><strong>Estate planning is way too important to neglect. Do not trust non-attorneys or online services to handle your estate plan \u2013 the consequences may be dire. The choice of a lawyer is an important decision and should not be based solely upon advertisements.</strong></p>", "summary": "Register to view our estate planning presentation:\nAvailable online on\u00a0Friday, Oct 2, at 2:30 PM and\u00a0Saturday, Oct 3, at 11:00...", "promoted": 1, "address": {"name": "Webinar - Online Presentation", "streetAddress": "", "city": "", "region": "", "country": "US", "postalCode": "", "longitude": 0, "latitude": 0}, "sharedPatches": [], "sharedCounties": [], "sharedRegions": [2730], "isSharedNationally": false, "totalFlags": 0, "repliesEnabled": true, "replyCount": 0, "totalReplies": 0, "itemAlias": "/new-jersey/cherryhill/calendar/event/20261002/fb7092be-7d6d-4532-b134-fef78e001a5a/estate-planning-5-essential-things-you-should-know", "canonicalUrl": "/new-jersey/paramus/calendar/event/20261002/fb7092be-7d6d-4532-b134-fef78e001a5a/estate-planning-5-essential-things-you-should-know", "created": "2026-10-01T01:22:56.954Z", "updated": "2026-10-01T05:01:29.080Z", "displayDate": "2026-10-02T18:30:00.000Z", "displayDateTimestamp": "1790965800", "ogTitle": "Local Event: Estate Planning: 5 Essential Things You Should Know", "ogImageUrl": "https://patch.com/img/cdn20/users/23850814/20260121/112106/webinar-1200-800___21112103566.jpg", "patch": {"alias": "/new-jersey/paramus", "id": 907, "model": "sprout", "name": "Paramus", "county": {"id": 101777, "name": "Bergen County", "code": "NJ", "fipsCode": "34003"}, "region": {"abbreviation": "NJ", "alias": "/new-jersey/across-nj", "id": 2730, "name": "New Jersey", "fipsCode": "34"}, "type": "community"}, "eventSiteUrl": "https://milvidlaw.com/webinar/p/5-things/?utm_source=patch&utm_campaign=turning_65_webinar", "imageThumbnail": "https://patch.com/img/cdn20/users/23850814/20260121/112106/webinar-1200-800___21112103566.jpg", "promotedStartDate": "2026-10-01T00:00:00.000Z", "promotedEndDate": "2026-10-02T23:59:59.000Z"}], "1791028800": [{"id": "c62d3ac7-00cf-4b53-b7b4-8adc4170dcbe", "title": "The Race Of Gentlemen Sat & Sun Oct. 3 & 4, 2026", "shortTitle": "The Race Of Gentlemen Sat & Sun Oct. 3 & 4, 2026", "status": 1, "type": "event", "eventType": "paid", "body": "<p>Experience the world famous beach race featuring vintage autos and motorcycles competing for speed on the sands of Wildwood. This high-octane event celebrates American automotive heritage with thrilling live racing action. Sponsored by Greater Wildwoods Tourism Development Authority.</p>", "summary": "Experience the world famous beach race featuring vintage autos and motorcycles competing for speed on the sands of Wildwood....", "promoted": 1, "address": {"name": "Wildwood Beach- Morey's Mariner Pier", "streetAddress": "", "city": "", "region": "", "country": "US", "postalCode": "", "longitude": 0, "latitude": 0}, "sharedPatches": [], "sharedCounties": [101779, 101790], "sharedRegions": [], "isSharedNationally": false, "totalFlags": 0, "repliesEnabled": true, "replyCount": 0, "totalReplies": 0, "itemAlias": "/new-jersey/cherryhill/calendar/event/20261003/c62d3ac7-00cf-4b53-b7b4-8adc4170dcbe/the-race-of-gentlemen-sat-sun-oct-3-4-2026", "canonicalUrl": "/new-jersey/flemington/calendar/event/20261003/c62d3ac7-00cf-4b53-b7b4-8adc4170dcbe/the-race-of-gentlemen-sat-sun-oct-3-4-2026", "created": "2026-09-25T16:18:08.837Z", "updated": "2026-09-25T16:19:19.054Z", "displayDate": "2026-10-03T12:00:00.000Z", "displayDateTimestamp": "1791028800", "ogTitle": "Local Event: The Race Of Gentlemen Sat & Sun Oct. 3 & 4, 2026", "ogImageUrl": "https://patch.com/img/cdn20/users/26205482/20260925/120935/flyer-84c1f800-2749-4b9e-bcbc-c3a17646f837___25120934616.jpg", "patch": {"alias": "/new-jersey/flemington", "id": 11263, "model": "sprout", "name": "Flemington", "county": {"id": 101785, "name": "Hunterdon County", "code": "NJ", "fipsCode": "34019"}, "region": {"abbreviation": "NJ", "alias": "/new-jersey/across-nj", "id": 2730, "name": "New Jersey", "fipsCode": "34"}, "type": "community"}, "eventSiteUrl": "https://www.theraceofgentlemen.com", "imageThumbnail": "https://patch.com/img/cdn20/users/26205482/20260925/120935/flyer-84c1f800-2749-4b9e-bcbc-c3a17646f837___25120934616.jpg", "promotedStartDate": "2026-09-25T00:00:00.000Z", "promotedEndDate": "2026-10-01T23:59:59.000Z"}, {"id": "98f93c17-6819-4a74-a41c-8d7945868469", "title": "4th Annual Oktoberfest at The Red Barn Farm", "shortTitle": "4th Annual Oktoberfest at The Red Barn Farm", "status": 1, "type": "event", "eventType": "paid", "body": "<p>\ud83c\udf89 \ud835\udddd\ud835\uddfc\ud835\uddf6\ud835\uddfb \ud835\ude02\ud835\ude00 \ud835\uddee\ud835\ude01 \ud835\udde7\ud835\uddf5\ud835\uddf2 \ud835\udde5\ud835\uddf2\ud835\uddf1 \ud835\uddd5\ud835\uddee\ud835\uddff\ud835\uddfb \ud835\uddd9\ud835\uddee\ud835\uddff\ud835\uddfa \ud835\uddf3\ud835\uddfc\ud835\uddff \ud835\ude01\ud835\uddf5\ud835\uddf2 \ud835\udff0\ud835\ude01\ud835\uddf5 \ud835\uddd4\ud835\uddfb\ud835\uddfb\ud835\ude02\ud835\uddee\ud835\uddf9 \ud835\udde2\ud835\uddf8\ud835\ude01\ud835\uddfc\ud835\uddef\ud835\uddf2\ud835\uddff\ud835\uddf3\ud835\uddf2\ud835\ude00\ud835\ude01!!<br>\ud83d\udccd 391 US-Route 206, Hammonton, NJ<br>\ud83d\udcc5 Saturday, Oct 3 &amp; Sunday, Oct 4 \u00b7 10AM\u20138PM each day. Choose your day, or come for both!</p>\n\n<p>Fairgrounds admission is free. Walk in for live polka music, a biergarten with Spellbound Brewing and Blue Rascal Distillery, a stein holding competition, barrel rolling, Hammerschlagen, and lawn games. Fritz Grill serves German food all weekend, with apple cider donuts, water ice, and Jersey Berries &amp; Bean ice cream on the fairgrounds. Food, drink, and farm fun attractions are pay as you go.</p>\n<p>\u2728 \ud835\udc04\ud835\udc27\ud835\udc23\ud835\udc28\ud835\udc32 \ud835\udc1a \ud835\udc1d\ud835\udc1a\ud835\udc32 \ud835\udc1f\ud835\udc2e\ud835\udc25\ud835\udc25 \ud835\udc28\ud835\udc1f:</p>\n<p>\ud83e\udd68 Authentic German Food from our Fritz Grill<br>\ud83c\udf66 Jersey  \ud83e\uded0 Berries &amp; Bean Ice Cream<br>\ud83c\udf69 Apple Cider Donuts<br>\ud83c\udf67 Water Ice<br>\ud83c\udf7b Biergarten with <a href=\"https://www.spellboundbrewing.com/\" target=\"_blank\" rel=\"nofollow noopener\">Spellbound Brewing</a> &amp; <a href=\"https://bluerascaldistillery.com/\" target=\"_blank\" rel=\"nofollow noopener\">Blue Rascal Distillery</a><br>\ud83d\udcaa Stein Holding Competition<br>\ud83c\udfb6 Live Polka Music: <a href=\"https://www.doppelgangermusik.com/\" target=\"_blank\" rel=\"nofollow noopener\">Doppelg\u00e4nger</a> on Saturday, <a href=\"https://www.facebook.com/polkadelphia/\" target=\"_blank\" rel=\"nofollow noopener\">Polkadelphia</a> on Sunday<br>\ud83d\udee2\ufe0f Barrel Rolling<br>\ud83d\udd28 Hammerschlagen<br>\ud83c\udf3d Giant Corn Maze<br>\ud83d\ude9c Hayrides to \ud83c\udf3b Sunflowers &amp; \ud83c\udf83 Pumpkins<br>\ud83c\udfaf Games<br>\ud83e\udd38 Fairgrounds<br>\ud83d\udedd Giant Bounce Pillow</p>\n<p>\ud83c\udf3b\ud83c\udf83 \ud835\udde2\ud835\uddfb\ud835\uddf9\ud835\ude06 \ud835\ude01\ud835\uddf5\ud835\uddf6\ud835\ude00 \ud835\ude04\ud835\uddf2\ud835\uddf2\ud835\uddf8\ud835\uddf2\ud835\uddfb\ud835\uddf1: Your u-pick hayride ticket gets you one free sunflower AND one free pumpkin!</p>\n<p>\ud83c\udf19 Stay after dark on Saturday. Our Night Maze opens 7 to 10 PM, same Corn Maze ticket, flashlight included.</p>\n<p>\u267f New this year: an ADA-accessible hayride wagon so the whole family can ride together.<br>\ud83d\udc3e Fur-baby friendly!</p>\n<p>\ud83c\udf9f Purchase tickets ahead of time for our Giant Corn Maze, Hayride U-Pick, and Giant Bounce Pillow at:</p>\n<p>\ud83d\udc49 <a href=\"https://www.TheRedBarn.Farm\" rel=\"nofollow noopener\" target=\"_blank\">TheRedBarn.Farm</a></p>\n<p>All Access Pass bundles all three attractions. Save 10% when you buy online before you arrive with code \"FALL10\".<br><br>Hayride U-Pick tickets tend to sell out, so secure yours today! \ud83d\udc76 Children 12 months and under are free on all attractions.</p>\n<p>\ud83c\udf82 Book a private party at our Fairgrounds Picnic Classic, Party Barn Pavilion (daytime), or Sunset Pavilion (evening): <a href=\"https://www.theredbarn.farm/private-events\" rel=\"nofollow noopener\" target=\"_blank\">theredbarn.farm/private-events</a></p>\n<p>\ud83d\udcc5 Mark your calendars and gather your crew, and get ready to raise a stein with us!</p><p>Facebook event (RSVP &amp; weather updates): <a href=\"https://www.facebook.com/share/1HoV87vMdB/\" rel=\"nofollow noopener\" target=\"_blank\">https://www.facebook.com/share/1HoV87vMdB/</a></p>\n<p>Come for the fun, stay for the sunsets! \ud83c\udf05</p>", "summary": "\ud83c\udf89 \ud835\udddd\ud835\uddfc\ud835\uddf6\ud835\uddfb \ud835\ude02\ud835\ude00 \ud835\uddee\ud835\ude01 \ud835\udde7\ud835\uddf5\ud835\uddf2 \ud835\udde5\ud835\uddf2\ud835\uddf1 \ud835\uddd5\ud835\uddee\ud835\uddff\ud835\uddfb \ud835\uddd9\ud835\uddee\ud835\uddff\ud835\uddfa \ud835\uddf3\ud835\uddfc\ud835\uddff \ud835\ude01\ud835\uddf5\ud835\uddf2 \ud835\udff0\ud835\ude01\ud835\uddf5 \ud835\uddd4\ud835\uddfb\ud835\uddfb\ud835\ude02\ud835\uddee\ud835\uddf9 \ud835\udde2\ud835\uddf8\ud835\ude01\ud835\uddfc\ud835\uddef\ud835\uddf2\ud835\uddff\ud835\uddf3\ud835\uddf2\ud835\ude00\ud835\ude01!! \ud83d\udccd 391 US-Route 206, Hammonton, NJ \ud83d\udcc5 Saturday, Oct 3 & Sunday,...", "promoted": 1, "address": {"name": "The Red Barn Farm", "streetAddress": "391 US-206", "city": "Hammonton", "region": "NJ", "country": "US", "postalCode": "08037", "longitude": -74.7735332, "latitude": 39.6709669}, "sharedPatches": [819, 1300, 28586, 28830, 818, 1176, 28832, 28288, 28376, 28245], "sharedCounties": [], "sharedRegions": [], "isSharedNationally": false, "totalFlags": 0, "repliesEnabled": true, "replyCount": 0, "totalReplies": 0, "itemAlias": "/new-jersey/cherryhill/calendar/event/20261003/98f93c17-6819-4a74-a41c-8d7945868469/4th-annual-oktoberfest-at-the-red-barn-farm", "canonicalUrl": "/new-jersey/hammonton-nj/calendar/event/20261003/98f93c17-6819-4a74-a41c-8d7945868469/4th-annual-oktoberfest-at-the- m.&nbsp;</p>\n<p>Musical entertainment will be provided by the Haddonfield Pick-Up Band, the Golden Kazoo Band, ChildrenSong of New Jersey, a Pine Barons&nbsp;Quartet, and Jessica Lucas &amp; Friends.<br>&nbsp;<br>Set to run from 10am to 4pm, Fall Festival is organized by the Haddonfield Lions Club. This year's presenting sponsor is Cherry Hill Imports Auto Group (Mercedes, Audi, Porsche, VW, Land Rover). Several vehicles will be displayed at Kings Court. Other sponsors&nbsp;include Fulton Bank, Dynamic Language Services, S.A.M. Haddonfield, Sugar Space Wellness, Haddonfield.Today, and Heiler Painting.&nbsp;Financial support has been provided by The Haddonfield Foundation.</p>\n<p>The event is rain or shine.</p>\n<p>Inquiries:&nbsp;FallFestival08033@gmail.com<br></p>", "summary": "A juried crafts show on Tanner Street with more than 45 vendors,\u00a0pumpkin painting, face painting, balloon twisters, a...", "promoted": 1, "address": {"name": "", "streetAddress": "", "city": "Haddonfield", "region": "NJ", "country": "US", "postalCode": "", "longitude": -75.0316874, "latitude": 39.898163}, "sharedPatches": [815, 1300, 818, 28464, 28262, 28800, 28465], "sharedCounties": [], "sharedRegions": [], "isSharedNationally": false, "totalFlags": 0, "repliesEnabled": true, "replyCount": 0, "totalReplies": 0, "itemAlias": "/new-jersey/cherryhill/calendar/event/20261003/2a52b739-d26a-4fb0-909c-5f11a96b49d1/haddonfield-fall-festival-2026", "canonicalUrl": "/new-jersey/haddon/calendar/event/20261003/2a52b739-d26a-4fb0-909c-5f11a96b49d1/haddonfield-fall-festival-2026", "created": "2026-09-29T15:41:03.196Z", "updated": "2026-09-29T15:41:03.196Z", "displayDate": "2026-10-03T14:00:00.000Z", "displayDateTimestamp": "1791036000", "ogTitle": "Local Event: Haddonfield Fall Festival 2026", "ogImageUrl": "https://patch.com/img/cdn20/users/27186165/20260929/113932/fall-festival-2026-web-graphic___29113931022.jpg", "patch": {"alias": "/new-jersey/haddon", "id": 812, "model": "mature", "name": "H
