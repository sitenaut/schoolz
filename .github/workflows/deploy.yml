name: Deploy

# A push to main deploys what changed, once CI passes on the merged code:
# backend/** -> schoolz-api, frontend/** -> schoolz-web, nothing else ->
# nothing. "Changed" means since the commit each app is running, read from
# its image label (sha-<commit>), so a cancelled or failed run is caught up by
# the next push. Migrations run inside the backend deploy, in Fly's release
# step (backend/fly.toml, scripts/release.py), before any machine is replaced.
# After each deploy a smoke check runs; if the deploy or the smoke check
# fails, the image that was running before is put back (the schema is not).
# By hand: Actions -> Deploy -> Run workflow (main only). The scraper is
# deployed by hand only (target=scraper). drill=true proves the rollback:
# the deploy goes out, the smoke check fails on purpose, and the rollback
# must leave the previous image running.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "both"
        type: choice
        options: ["both", "backend", "frontend", "scraper"]
      drill:
        description: "Rollback drill: deploy, then fail the smoke check on purpose so the image that was running is put back"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: What changed since each app's running commit
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$TARGET" in
              both)     echo backend=true >> "$GITHUB_OUTPUT"; echo frontend=true >> "$GITHUB_OUTPUT" ;;
              backend)  echo backend=true >> "$GITHUB_OUTPUT" ;;
              frontend) echo frontend=true >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          # running_base <fly app>: the commit the app runs, or "" if unknown
          running_base() {
            tag=$(flyctl image show -a "$1" --json | jq -r '[.[] | .Tag // empty][0] // ""')
            base=${tag#sha-}
            if [[ "$tag" == sha-* ]] && git cat-file -e "$base^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
              echo "$base"
            else
              echo "$1 runs '$tag', not a known commit on main" >&2
            fi
          }
          changed() {  # changed <base> <paths...>; an unknown base counts as changed
            [ -z "$1" ] && return 0
            ! git diff --quiet "$1" "$GITHUB_SHA" -- "${@:2}"
          }
          api=$(running_base schoolz-api)
          web=$(running_base schoolz-web)
          if changed "$api" backend/; then
            echo "backend: deploying (running ${api:-unknown})"; echo backend=true >> "$GITHUB_OUTPUT"
          else
            echo "backend: nothing in backend/ changed since $api"
          fi
          if changed "$web" frontend/; then
            echo "frontend: deploying (running ${web:-unknown})"; echo frontend=true >> "$GITHUB_OUTPUT"
          else
            echo "frontend: nothing in frontend/ changed since $web"
          fi

  backend:
    name: Deploy backend (schoolz-api)
    needs: [ci, changes]
    if: >
      always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: schoolz-api
      URL: https://schoolz-api.sitenaut.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Remember the running image
        id: prev
        run: |
          ref=$(flyctl image show -a "$APP" --json | jq -r '[.[] | select(.Digest != null and .Digest != "")][0] | "\(.Registry)/\(.Repository)@\(.Digest)"')
          echo "Running now: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Deploy (the release step migrates first)
        working-directory: backend
        run: flyctl deploy --remote-only --image-label "sha-${GITHUB_SHA::12}"

      - name: Smoke
        env:
          DRILL: ${{ inputs.drill }}
        # /schools reads the database; /mcp/ is asked with the real public
        # Host header (an mcp upgrade once refused every prod Host with 421
        # while 127.0.0.1 still worked).
        run: |
          answer() {  # answer <description> <curl args...>
            for _ in $(seq 1 20); do
              if curl -fsS --max-time 10 -o /dev/null "${@:2}"; then echo "ok: $1"; return 0; fi
              sleep 6
            done
            echo "::error::$1 did not answer"; return 1
          }
          answer "/health" "$URL/health"
          answer "/schools" "$URL/schools"
          answer "MCP initialize" -X POST "$URL/mcp/" \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"0"}}}'
          # The API docs are local only (main.py). A warning, not a rollback:
          # the old image would serve them too.
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$URL/openapi.json")
          if [ "$code" = 404 ]; then echo "ok: /openapi.json is not served"; else echo "::warning::/openapi.json answered $code in prod"; fi
          if [ "$DRILL" = true ]; then echo "::error::Rollback drill: failing the smoke check on purpose"; exit 1; fi

      - name: Roll back to the image that was running
        if: failure() && steps.prev.outputs.ref != '' && steps.prev.outputs.ref != 'null/null@null'
        working-directory: backend
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          echo "::warning::Deploy or smoke check failed; putting back $PREV"
          # Without the release step: the old image must not touch the schema,
          # and an image from before release.py existed has no script to run.
          grep -v '^[[:space:]]*release_command' fly.toml > fly.rollback.toml
          flyctl deploy -c fly.rollback.toml --image "$PREV" --strategy immediate
          # Every machine must be back on that image, or the rollback didn't take.
          now=$(flyctl image show -a "$APP" --json | jq -r '[.[] | .Digest // empty] | unique | join(" ")')
          if [ "$now" != "${PREV##*@}" ]; then echo "::error::after the rollback $APP runs $now, expected ${PREV##*@}"; exit 1; fi
          echo "Rolled back: every machine runs ${PREV##*@}"
          # --strategy immediate restarts every machine at once, so the API is
          # down while they boot (the drill's single try timed out at 10s).
          for _ in $(seq 1 20); do
            curl -fsS --max-time 10 -o /dev/null "$URL/health" && { echo "ok: /health after the rollback"; exit 0; }
            sleep 6
          done
          echo "::error::/health did not answer after the rollback"; exit 1

  frontend:
    name: Deploy frontend (schoolz-web)
    needs: [ci, changes, backend]
    # After the backend when both changed; on its own when only it did. A
    # failed backend still blocks it.
    if: >
      always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: schoolz-web
      URL: https://schoolz.sitenaut.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Remember the running image
        id: prev
        run: |
          ref=$(flyctl image show -a "$APP" --json | jq -r '[.[] | select(.Digest != null and .Digest != "")][0] | "\(.Registry)/\(.Repository)@\(.Digest)"')
          echo "Running now: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Deploy
        working-directory: frontend
        run: flyctl deploy --remote-only --image-label "sha-${GITHUB_SHA::12}" --build-arg "VITE_APP_VERSION=${GITHUB_SHA::7}"

      - name: Smoke
        env:
          DRILL: ${{ inputs.drill }}
        # /focus/ is a separate build in the same image; it once answered 500
        # while / was fine.
        run: |
          for path in / /focus/; do
            ok=
            for _ in $(seq 1 20); do
              if curl -fsS --max-time 10 -o /dev/null "$URL$path"; then ok=1; echo "ok: $path"; break; fi
              sleep 6
            done
            [ -n "$ok" ] || { echo "::error::$URL$path did not answer"; exit 1; }
          done
          if [ "$DRILL" = true ]; then echo "::error::Rollback drill: failing the smoke check on purpose"; exit 1; fi

      - name: Roll back to the image that was running
        if: failure() && steps.prev.outputs.ref != '' && steps.prev.outputs.ref != 'null/null@null'
        working-directory: frontend
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          echo "::warning::Deploy or smoke check failed; putting back $PREV"
          # Without the release step: the old image must not touch the schema,
          # and an image from before release.py existed has no script to run.
          grep -v '^[[:space:]]*release_command' fly.toml > fly.rollback.toml
          flyctl deploy -c fly.rollback.toml --image "$PREV" --strategy immediate
          # Every machine must be back on that image, or the rollback didn't take.
          now=$(flyctl image show -a "$APP" --json | jq -r '[.[] | .Digest // empty] | unique | join(" ")')
          if [ "$now" != "${PREV##*@}" ]; then echo "::error::after the rollback $APP runs $now, expected ${PREV##*@}"; exit 1; fi
          echo "Rolled back: every machine runs ${PREV##*@}"

  scraper:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        working-directory: scraper
