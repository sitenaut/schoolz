name: CI

# The gate for a pull request. backend, frontend and images are the checks
# main requires. images, secrets and audit run on pull requests only; audit
# reports and is not meant to be required (a newly published advisory
# shouldn't block unrelated PRs).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolz
          POSTGRES_USER: schoolz
          POSTGRES_PASSWORD: ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U schoolz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: schoolz
      DATABASE_USER: schoolz
      DATABASE_PASSWORD: ci
      DATABASE_SSL_MODE: disable
      AUTH_MODE: local
      JWT_SECRET: ci-secret
      ANTHROPIC_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint floor (whole tree)
        run: ruff check --no-cache --select E4,E7,E9,F --ignore E741 .
      - name: Lint, full rule set (Python files this pull request touches)
        # backend/ruff.toml. `ruff check --fix <file>` clears most of it.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          mapfile -t files < <(git diff --name-only --relative --diff-filter=AMR "$BASE" HEAD -- '*.py')
          if [ ${#files[@]} -eq 0 ]; then echo "no Python files touched"; exit 0; fi
          ruff check --no-cache "${files[@]}"
      - name: Alembic has a single head
        run: python scripts/check_alembic_single_head.py
      - name: Migrations only add (no drop or delete without a destructive-ok note)
        run: python scripts/check_migrations_additive.py
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_AUTH_MODE: local
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30's undici needs Node 22 to load (zstd in zlib). The web
          # image builds on the same line (frontend/Dockerfile).
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/focus/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (no errors; warnings held under the cap in package.json)
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Type-check and build
        run: npm run build
      - name: Focus app - install
        working-directory: frontend/focus
        run: npm ci
      - name: Focus app - type-check and build
        working-directory: frontend/focus
        run: npm run build

  images:
    # Both Dockerfiles still build, and each image starts: the API answers
    # /health with no database (Fly's machine check depends on that), and the
    # web image renders its nginx templates and serves the page. Pull
    # requests only; Fly builds the deployed images itself.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -t schoolz-api:ci backend
      - name: Build the web image
        run: docker build -t schoolz-web:ci frontend
      - name: API image starts
        run: |
          docker run -d --name api -e APP_ENV=local -e AUTH_MODE=local -e JWT_SECRET=ci \
            -e DATABASE_HOST=127.0.0.1 -p 8000:8000 schoolz-api:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Web image serves the page
        run: |
          docker run -d --name web -e BACKEND_INTERNAL_URL=http://127.0.0.1:8000 -e RESOLVER=127.0.0.11 \
            -p 3000:3000 schoolz-web:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null localhost:3000/ && exit 0; sleep 2; done
          docker logs web; exit 1

  secrets:
    # The pull request's own commits only, so history never fails a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="$BASE..$HEAD"

  audit:
    # Known-vulnerable dependencies. Report only until SZ-14 locks the Python
    # dependencies; then this fails on findings.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: pip install pip-audit==2.9.0 && pip-audit -r backend/requirements.txt --progress-spinner off
      - name: npm production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
