app = "schoolz-web"
primary_region = "ewr"

[build]
  # Supabase's URL and "publishable" (anon) key are safe to ship in a public
  # client bundle - they're designed to be public and are constrained by
  # Row Level Security, not secrecy. Never put the service_role key here.
  [build.args]
    VITE_AUTH_MODE = "supabase"
    VITE_API_URL = "https://schoolz-api.sitenaut.com"
    VITE_SUPABASE_URL = "https://lxithuvstfslndvsdnsk.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ymxiIhkeaV6R5egNQI9gwA_iY95YXIR"
    VITE_APP_VERSION = "prod"
    VITE_FARO_URL = "/rum/collect"
    VITE_PUBLIC_WEB_URL = "https://schoolz.sitenaut.com"

[env]
  # Not sensitive (just an internal hostname on Fly's private 6PN network),
  # so it's a plain fly.toml env var rather than a `fly secrets set` -
  # nginx.conf.template proxies crawler user agents here instead of
  # serving the SPA shell, for SEO. schoolz-api must stay always-on
  # (min_machines_running = 1, see backend/fly.toml) for this to resolve.
  BACKEND_INTERNAL_URL = "http://schoolz-api.internal:8000"
  # Fly's own internal DNS resolver (6PN) - Docker's embedded 127.0.0.11
  # (the image's default) doesn't exist on a Fly machine.
  RESOLVER = "[fdaa::3]:53"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
