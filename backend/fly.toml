app = "schoolz-api"
primary_region = "ewr"

[build]

[env]
  APP_ENV = "prod"
  AUTH_MODE = "supabase"
  PORT = "8000"
  # Emit the stable HTTP semantic conventions
  # (http_server_request_duration_seconds, labelled http_route) instead of
  # the old ones (http_server_duration_milliseconds, labelled http_target).
  # Every dashboard in grafana/ and the schoolz-api-5xx / schoolz-api-latency
  # alert rules were already written against the stable names, so without
  # this they match nothing at all - confirmed live on 2026-09-15, where
  # prod was emitting only the old names and both alerts had therefore never
  # been able to fire. http_route is also the templated path, so this keeps
  # series cardinality bounded by route rather than by school slug.
  OTEL_SEMCONV_STABILITY_OPT_IN = "http"
  PUBLIC_WEB_URL = "https://schoolz.sitenaut.com"
  PUBLIC_API_URL = "https://schoolz-api.sitenaut.com"
  # No FRONTEND_INTERNAL_URL here on purpose: services/prerender.py falls
  # back to PUBLIC_WEB_URL when it's unset, so the scraper renders
  # https://schoolz.sitenaut.com/... the same way it renders any other
  # public site - over the public internet, through fly-proxy, which wakes
  # schoolz-web on demand exactly like a real visitor would. Pointing this
  # at schoolz-web.internal instead would need schoolz-web to run with
  # min_machines_running = 1 (Fly's private network doesn't wake stopped
  # machines the way the public proxy does - see the scraper's own
  # always-on requirement above) - not worth that standing cost for a
  # low-volume crawler endpoint. Local compose sets FRONTEND_INTERNAL_URL
  # because localhost:5173 there only resolves on the host, not from
  # another container.

[processes]
  # REVERTED (2026-09-12): tried "--host ::" here to make schoolz-api
  # reachable over Fly's 6PN for the SEO prerender feature (mirroring the
  # scraper's own bind), but unlike the scraper - which has no public
  # http_service at all - schoolz-api's fly-proxy health check needs
  # 0.0.0.0 and started failing outright ("instance refused connection")
  # the moment this changed, taking prod down. Fixed properly instead by
  # routing the prerender proxy through schoolz-api's public hostname
  # (frontend/fly.toml's BACKEND_INTERNAL_URL) rather than 6PN, so this
  # process never needs to accept private-network traffic at all.
  # --proxy-headers + --forwarded-allow-ips='*' (added 2026-09-14): Fly
  # terminates TLS at its edge and forwards plain HTTP to this process, so
  # without this uvicorn believes every request arrived over http and
  # self-generates redirect Location headers as http:// even for a
  # request that came in over https. Confirmed real: a 307 for a bare
  # POST /mcp (no trailing slash - see mcp_server.py) came back as
  # `Location: http://schoolz-api.sitenaut.com/mcp/`, and curl - by
  # design - refuses to resend a POST body across an https-to-http
  # downgrade, so the redirect silently arrived at the server with an
  # empty body. Trusting '*' is fine here since fly-proxy is the only
  # thing that can reach this process's public port at all.
  app = "uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
  scheduler = "python -m scheduler.entrypoint"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keeps one "app" machine always warm - real cold starts confirmed live
  # (a stopped machine picking up a request after an idle stretch, several
  # seconds of blank page before data loads) via docs/OBSERVABILITY_PLAN.md
  # Phase 6's hypothesis #5, now no longer a hypothesis. schoolz-web stays
  # scale-to-zero: static file serving cold-starts fast, not worth the
  # always-on cost there.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  # 256mb got OOM-killed running three scans at once; the Monday cron runs
  # all eight newsletter extractions (pdfplumber, Pillow re-encoding, the
  # vision calls) concurrently in this one process.
  memory = "512mb"
  processes = ["scheduler"]
