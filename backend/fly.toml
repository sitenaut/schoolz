app = "schoolz-api"
primary_region = "ewr"

[build]

[env]
  APP_ENV = "prod"
  AUTH_MODE = "supabase"
  PORT = "8000"
  PUBLIC_WEB_URL = "https://schoolz.sitenaut.com"
  PUBLIC_API_URL = "https://schoolz-api.sitenaut.com"

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8000"
  scheduler = "python -m scheduler.entrypoint"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  # 256mb got OOM-killed running three scans at once; the Monday cron runs
  # all eight newsletter extractions (pdfplumber, Pillow re-encoding, the
  # vision calls) concurrently in this one process.
  memory = "512mb"
  processes = ["scheduler"]
