services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolz
      POSTGRES_USER: schoolz
      POSTGRES_PASSWORD: ci

steps:
  migrate:
    image: python:3.12-slim
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: schoolz
      DATABASE_USER: schoolz
      DATABASE_PASSWORD: ci
      AUTH_MODE: local
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc
      - pip install -r backend/requirements.txt
      - cd backend && alembic upgrade head

  backend-test:
    image: python:3.12-slim
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: schoolz
      DATABASE_USER: schoolz
      DATABASE_PASSWORD: ci
      AUTH_MODE: local
      JWT_SECRET: ci-secret
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libpq-dev gcc
      - pip install -r backend/requirements.txt
      - cd backend && pytest -q

  frontend-build:
    image: node:20-alpine
    environment:
      VITE_AUTH_MODE: local
      VITE_API_URL: http://localhost:8000
    commands:
      - cd frontend && npm install && npm run build

  frontend-test:
    image: node:20-alpine
    commands:
      - cd frontend && npm install && npm run test

  scraper-test:
    image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    environment:
      SCRAPER_API_KEY: ci-secret
    commands:
      - pip install -r scraper/requirements.txt
      - cd scraper && pytest -q

when:
  event: [push, manual]
