name: Deploy

on:
  workflow_run:
    workflows: ["DB migrate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "both"
        type: choice
        options: ["both", "backend", "frontend"]

jobs:
  deploy-backend:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'backend' || github.event.inputs.target == 'both') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    needs: deploy-backend
    # A skipped backend job must NOT skip this one: with `target=frontend`
    # the backend job is skipped by design, and requiring its result to be
    # 'success' made "frontend" an option that could never deploy anything
    # (confirmed 2026-09-18: two frontend-only dispatches both ended
    # "skipped" in 3s). A FAILED backend still blocks, as before. The
    # target check keeps `target=backend` from shipping the frontend too.
    if: >
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg VITE_APP_VERSION=${GITHUB_SHA::7}
        working-directory: frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
