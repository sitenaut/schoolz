# schoolz's primary scraper: the shared playwright-scraper
# (Profitnaut/playwright-scraper, the same service as the droplet and the Pi),
# built at the commit in SOURCE_REF. Its code, API and RUNBOOK live in that
# repo; schoolz keeps only this file and the pin. Deploy and roll back with
# scripts/deploy-scraper.sh.
#
# No public IP on purpose: the backend reaches it over Fly's private network
# (SCRAPER_URL = http://schoolz-scraper.internal:8765). SCRAPER_API_KEY is
# still required, as defense in depth.
app = "schoolz-scraper"
primary_region = "ewr"
# uvicorn waits up to 170 s for running renders before it exits.
kill_timeout = 180

[env]
  APP_ENV = "prod"
  # 1 GB machines: one render at a time on each (two machines, so two at
  # once; scraper_client spreads requests over them, since .internal alone
  # sent every request from a process to the same one). The image's
  # defaults (2 renders x 900 MB) are sized for the droplet's 1.5 GB box.
  # Extra requests queue (MAX_QUEUE, 90 s) and then get a 503, which the
  # backend treats as retryable and takes to the droplet.
  MAX_CONCURRENCY = "1"
  # The watchdog adds up the resident memory of every process in a render's
  # Chromium, and the memory those processes share counts once per process:
  # a blank page counts about 470 MB while really using about 280. At 700,
  # Finalsite pages counting 700-750 MB (470-510 real) were killed: 57 scan
  # renders between 2026-11-05 and 11-06, Cherry Hill directories and
  # Hamilton Township's among them. 900 counted is about 600-650 MB real.
  RENDER_MAX_RSS_MB = "900"
  # The metrics server on :9464 listens dual-stack, so schoolz-scraper-metrics
  # can scrape it over Fly's IPv6-only private network (scraper/telemetry/).
  METRICS_ADDR = "::"

[processes]
  # Listens dual-stack on "::": Fly's private network is IPv6-only, and its
  # machine checks connect over IPv4. uvicorn's own `--host ::` gives an
  # IPv6-only socket (asyncio sets IPV6_V6ONLY), so the socket is made here.
  # The image's ENTRYPOINT (tini) still wraps this, so the janitor runs.
  app = "python -c 'import socket, uvicorn; s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0); s.bind((\"::\", 8765)); uvicorn.Server(uvicorn.Config(\"app.main:app\", timeout_graceful_shutdown=170, server_header=False)).run(sockets=[s])'"

[[vm]]
  # Four shared vCPUs for the CPU, not the memory: 1 GB is what shared-cpu-4x
  # includes. Fly holds a shared machine to its baseline once its burst
  # balance (500 s at most) runs out, and each shared vCPU adds 1/16 of a
  # core to that baseline, so 4x keeps a quarter of a core. On shared-cpu-1x
  # the overnight prerender and scans spent the balance by about 05:00 UTC;
  # renders then ran ten times slower, and every page that needs more than
  # about one CPU-second to load timed out at 15 s (288 scan renders on
  # 2026-11-06). A school homepage takes about 5 CPU-seconds, a prerender
  # page about 3.
  size = "shared-cpu-4x"
  memory = "1024mb"
  processes = ["app"]

[[services]]
  internal_port = 8765
  protocol = "tcp"
  processes = ["app"]
  # Private traffic bypasses fly-proxy, so nothing would wake a stopped
  # machine, and .internal only resolves started ones: never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8765

[checks]
  # Real readiness: the canary renders a page every 5 minutes. A machine
  # whose Chromium can't render fails this, which fails a deploy.
  [checks.browser_health]
    port = 8765
    type = "http"
    method = "GET"
    path = "/health/deep"
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    processes = ["app"]
